name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make git describe see the tag, for the version stamp
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go test ./...
      - run: make dist
      - name: checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
